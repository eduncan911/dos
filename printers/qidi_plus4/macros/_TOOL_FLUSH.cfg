[gcode_macro _TOOL_FLUSH]
gcode:
  {% set count = params.COUNT|default(4)|int %}
  M117 Flush tooling
  M83
  G1 E1 F50
  G1 E28.13 F611
  G1 E0.97 F50
  G1 E8.73 F611
  G1 E0.97 F50
  G1 E8.73 F611
  G1 E0.97 F50
  G1 E-2 F1800
  {% for i in range(1, count + 1) %}
    M117 Poop { i } of { count }
    M106 S255
    M400
    G91
    G1 X-3 F60
    G1 X3 F60
    G90
    CLEAR_FLUSH
    M106 S60
    M83
    G1 E34.8 F611
    G1 E1.2 F50
    G1 E10.8 F611
    G1 E1.2 F50
    G1 E10.8 F611
    G1 E1.2 F50
    G1 E-2 F1800
  {% endfor %}
  M106 S0
