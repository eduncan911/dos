; TOOL_CHANGE is used to change filaments in the qidibox.
; 
; Orca:
;   TOOL_CHANGE TOOL={next_extruder} TEMP={new_filament_temp}
; Prusa:
;   TOOL_CHANGE TOOL=[next_extruder] TEMP=260
; 
[gcode_macro TOOL_CHANGE]
description: TOOL_CHANGE is used to change filaments in the qidibox.
gcode:
  {% set extruder = params.TOOL|default(-1)|int %}
  {% set hotendtemp = params.TEMP|default(257)|int %}
  {% set z_hop = params.Z_HOP|default(10)|int %}

  ; exit early, exit often
  ; 
  {% if printer.save_variables.variables.box_count < 1 %} 
    action_raise_error("QIDIBox is not enabled.")
  {% endif %}
  {% if extruder < 0 %}
    action_raise_error("TOOL_CHANGE must be called with the next tool's index.")
  {% endif %}

  ; retract, wipe, and hop up and out of the way.
  ; 
  {% if printer.print_stats.state == "printing" and printer.extruder.can_extrude %}
    M117 Tool change: wipe and z-hop
    M104 S{hotendtemp}
    G91
    M83
    G1 E-2 F6300
    G0 X5 Y5 F7800
    G0 Z{z_hop} F600
    G90
  {% endif %}

  ; we're going to be messing with stuff that could trigger a failure
  ; 
  DISABLE_ALL_SENSOR

  ; reset stats
  ; 
  SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
  SAVE_VARIABLE VARIABLE=retry_step VALUE=None
  SAVE_VARIABLE VARIABLE=is_tool_change VALUE=0
  {% for i in range(16) %}
    SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
    G4 P100
  {% endfor %}

  ; pull saved_variables
  ; 
  {% set vars = printer.save_variables.variables %}
  {% set last_load_slot = vars.last_load_slot|default("slot4") %}  ; last loaded filament
  {% set value_t = vars["value_t" ~ extruder]|default("slot" ~ extruder) %}

  ; keep track of tool changes
  ; 
  {% set count = namespace(value=0) %}
  {% if 'total_tool_changes' in vars %}
    {% set count.value = vars.total_tool_changes|int %}
  {% else %}
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
  {% endif %}

  M117 Tool change {last_load_slot} -> {value_t} @ {hotendtemp}

  ; is there filament at the toolhead, or not
  ; 
  {% if printer['hall_filament_width_sensor'].Diameter > 0.5 %}
    {% if last_load_slot != value_t %}
      CUT_FILAMENT
      MOVE_TO_TRASH
      M104 S{hotendtemp}
      EXTRUDER_UNLOAD SLOT={last_load_slot} ; updates vars
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp - 1}
      M83                                   ; relative E
      G1 E18 F300                           ; additional purge for cutter
      T{extruder}                           ; updates vars
      _TOOL_FLUSH
      {% set count.value = count.value + 1 %}
    {% endif %}
  {% else %}
    {% if last_load_slot != value_t %}
      MOVE_TO_TRASH
      M104 S{hotendtemp}
      EXTRUDER_UNLOAD SLOT={last_load_slot}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp - 1}
      T{extruder}
      _TOOL_FLUSH
      {% set count.value = count.value + 1 %}
    {% endif %}
  {% endif %}

  ; update count
  ;
  SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={ count.value }

  ; re-enable the sensors
  ; 
  ENABLE_ALL_SENSOR
