; TOOL_CHANGE is used to change filaments in the qidibox.
; 
; Orca:
;   TOOL_CHANGE TOOL={next_extruder} TEMP={new_filament_temp}
; Prusa:
;   TOOL_CHANGE TOOL=[next_extruder] TEMP=260
; 
[gcode_macro TOOL_CHANGE]
description: TOOL_CHANGE is used to change filaments in the qidibox.
gcode:
  ; parameters
  ; 
  {% set extruder = params.TOOL|default(-1)|int %}
  {% set hotendtemp = params.TEMP|default(257)|int %}
  {% set z_hop = params.Z_HOP|default(10)|int %}
  {% set wipe = params.WIPE|default(1)|int %}

  ; exit early, exit often
  ; 
  {% if printer.save_variables.variables.box_count < 1 %} 
    action_raise_error("TOOL_CHANGE: QIDIBox is not enabled.")
  {% endif %}

  ; are we asking for a different slot?
  ; or, is the existing slot not loaded?
  ; 
  {% set vars = printer.save_variables.variables %}
  {% set last_load_slot = vars.last_load_slot|default("slot4") %}  ; last loaded filament
  {% set value_t = vars["value_t" ~ extruder]|default("slot" ~ extruder) %}
  {% if last_load_slot != value_t 
      or printer['hall_filament_width_sensor'].Diameter < 0.5 %}

    M117 TOOL_CHANGE: {last_load_slot} -> {value_t} @ {hotendtemp}

    ; setup the state before saving
    ; 
    M104 S{hotendtemp}
    SAVE_GCODE_STATE NAME=tool_change_state

    ; setup the values used for handling different error conditions
    ; within the qidi firmware.
    ; 
    DISABLE_ALL_SENSOR    ; things below have failed with filament sensors enabled
    SAVE_VARIABLE VARIABLE=load_retry_num VALUE=0
    SAVE_VARIABLE VARIABLE=retry_step VALUE=None
    SAVE_VARIABLE VARIABLE=is_tool_change VALUE=0
    {% for i in range(16) %}
      SAVE_VARIABLE VARIABLE=runout_{i} VALUE=0
      G4 P100
    {% endfor %}

    ; find safe wiping and lifting positions
    ; 
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + (5 * (1 if th.axis_maximum.x - th.position.x > 20 else -1)) %}
    {% set y_safe = th.position.y + (5 * (1 if th.axis_maximum.y - th.position.y > 20 else -1)) %}
    {% set z_safe_relative = [z_hop, th.axis_maximum.z - th.position.z]|min %}

    ; when changing on 1st layers, we want to go back to full speeds.
    ; 
    SET_VELOCITY_LIMIT VELOCITY={ th.max_velocity } ACCEL={ th.max_accel } SQUARE_CORNER_VELOCITY={ th.square_corner_velocity }

    ; retract, wipe, and hop up and out of the way.
    ; 
    {% if printer.print_stats.state == "printing" %}
      M117 TOOL_CHANGE: Retract and wipe out.
      {% if printer.extruder.can_extrude %}
        M83
        G1 E-2 F6300
        M82
      {% endif %}
      {% if wipe == 1 %}
        G90
        G0 X{x_safe} Y{y_safe} F7800
      {% endif %}
      G91
      G0 Z{z_safe_relative} F2400
      G90
    {% endif %}

    ; cut
    {% set loaded = (printer['hall_filament_width_sensor'].Diameter > 0.5) %}
    {% if loaded %}
      M117 TOOL_CHANGE: Cut filament.
      CUT_FILAMENT
    {% endif %}

    ; move
    _TOOL_MOVE_BUCKET
    M104 S{hotendtemp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ hotendtemp - 1}
    M400

    ; unload
    {% if loaded %}
      M117 TOOL_CHANGE: Unload {last_load_slot}.
      EXTRUDER_UNLOAD SLOT={last_load_slot}
    {% endif %}

    ; pre-load
    {% if loaded %}
      M117 TOOL_CHANGE: Push out 18mm from the cut.
      M83
      G1 E18 F300
      M82
    {% endif %}

    ; load
    T{extruder}

    ; purge
    _TOOL_FLUSH
    
    ; keep track of tool changes
    ; 
    {% set count = namespace(value=0) %}
    {% if 'total_tool_changes' in vars %}
      {% set count.value = vars.total_tool_changes|int %}
    {% else %}
      SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    {% endif %}
    {% set count.value = count.value + 1 %}
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={ count.value }
    M117 TOOL_CHANGE: { count.value } total changes.

    ; ending state
    ; 
    M117 TOOL_CHANGE: Wait for hotend temp range
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp - 1} MAXIMUM={hotendtemp + 2}
    ENABLE_ALL_SENSOR
    M400
    G0 Y308 F12000
    RESTORE_GCODE_STATE NAME=tool_change_state MOVE=1

  {% else %}
    M117 TOOL_CHANGE: {value_t} already loaded, no change.
  {% endif %}
  M117 
