; screws_tilt_adjust is changed to end next to the homing position
; to make back-to-back runs quicker, as well as speeding things up.
; 
; please review the gcode_macro SCREWS_TILT_CALCULATE for
; additional functionality.
; 
[screws_tilt_adjust]
horizontal_move_z: 5
speed: 250
screw1: 260,20
screw1_name: Front right
screw2: 260,280
screw2_name: Back right
screw3: 0,280
screw3_name: Back left
screw4: 0,20
screw4_name: Front left
screw_thread: CW-M4
