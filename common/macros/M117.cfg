; M117 definition to enable console messages in both
; Klipper log and printer status displays (where supported).
; 
[gcode_macro M117]
description: Relay messages to Klippers RESPOND
rename_existing: M117.1
gcode:
  M117.1 {rawparams}
  {action_respond_info(rawparams)}

[respond]
default_type: echo
