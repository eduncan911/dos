[gcode_macro M191]
gcode:
  {% set s = params.S|float %}
  M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
  {% if s != 0 %}
    TEMPERATURE_WAIT SENSOR=chamber MINIMUM={ s-2 } MAXIMUM={ s+2 }
  {% endif %}
